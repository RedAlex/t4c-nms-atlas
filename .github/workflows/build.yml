name: CI-CD

on:
  push:
    branches:
      - main
      - master
    tags:
      - "v*"
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write

jobs:
  quality:
    name: Lint and Unit Tests
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Normalize lint issues
        run: npm run lint:fix

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test

  build-windows:
    name: Build Windows Package
    runs-on: windows-latest
    needs: quality

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build Windows archive
        run: npm run build:win

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-build
          path: |
            release/atlas-nms-revolution.zip
            release/Atlas NMS Revolution-win32-x64/**

  release:
    name: Create GitHub Release
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    needs: build-windows

    steps:
      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: windows-build
          path: .

      - name: Publish release assets
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            release/atlas-nms-revolution.zip
            release/Atlas NMS Revolution-win32-x64/Atlas NMS Revolution.exe
